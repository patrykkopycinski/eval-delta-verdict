# Local Elasticsearch 9 (single node, security OFF — local dev only).
# Bound to localhost only, port 19200 to avoid collisions (spec locked decision).
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.2
    container_name: edv-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.license.self_generated.type=basic
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - ingest.geoip.downloader.enabled=false
      - cluster.name=edv-local
      - node.name=edv-node-1
    ports:
      - "127.0.0.1:19200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - edv-es-data:/usr/share/elasticsearch/data

volumes:
  edv-es-data:
